<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- ============================================================
       Mdubusi Mathematics — Open Graph social card
       1200 × 630 (Facebook, LinkedIn, WhatsApp, Twitter in-stream)
       ============================================================ -->

  <defs>
    <!-- Rich navy gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3A6B"/>
      <stop offset="55%" stop-color="#132A4F"/>
      <stop offset="100%" stop-color="#0D1F3C"/>
    </linearGradient>

    <!-- Subtle radial highlight top-right -->
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.75">
      <stop offset="0%" stop-color="#2E6DB4" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#2E6DB4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#2E6DB4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- ============================================================
       Decorative background: scattered math glyphs, very low opacity
       ============================================================ -->
  <g fill="#F8F4EA" opacity="0.05" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif">
    <text x="90"   y="160"  font-size="110" font-style="italic">π</text>
    <text x="1030" y="210"  font-size="140" font-style="italic">∫</text>
    <text x="950"  y="540"  font-size="100" font-style="italic">Σ</text>
    <text x="110"  y="560"  font-size="90"  font-style="italic">∂</text>
    <text x="560"  y="100"  font-size="60"  font-style="italic">e^x</text>
    <text x="200"  y="380"  font-size="50"  font-style="italic">dx</text>
    <text x="870"  y="360"  font-size="55"  font-style="italic">lim</text>
  </g>

  <!-- Thin gold hairline frame -->
  <rect x="28" y="28" width="1144" height="574" rx="14"
        fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.45"/>

  <!-- ============================================================
       The mark — top-left
       ============================================================ -->
  <g transform="translate(80,80)">
    <circle cx="60" cy="60" r="56" fill="#1B3A6B"/>
    <circle cx="60" cy="60" r="56" fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.9"/>
    <line x1="34" y1="30" x2="86" y2="30" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 90 L 30 40 L 60 74 L 90 40 L 90 90"
          fill="none" stroke="#F8F4EA" stroke-width="8"
          stroke-linejoin="miter" stroke-linecap="square" stroke-miterlimit="4"/>
    <circle cx="60" cy="96" r="2.5" fill="#3AAA35"/>
  </g>

  <!-- Wordmark next to the mark -->
  <g transform="translate(220,108)">
    <text x="0" y="32"
          font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
          font-size="38" font-weight="500" letter-spacing="-0.5"
          fill="#F8F4EA">Mdubusi</text>
    <text x="2" y="58"
          font-family="'DM Sans', system-ui, sans-serif"
          font-size="12" font-weight="500" letter-spacing="4"
          fill="#C9A84C">MATHEMATICS</text>
  </g>

  <!-- Gold hairline separator under the wordmark, anchored to the logo row -->
  <line x1="80" y1="232" x2="380" y2="232" stroke="#C9A84C" stroke-width="1" opacity="0.6"/>

  <!-- ============================================================
       Primary message
       ============================================================ -->
  <g transform="translate(80,330)">
    <text font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif"
          font-weight="500" fill="#F8F4EA">
      <tspan x="0" y="0"   font-size="74">Mathematics mastery,</tspan>
      <tspan x="0" y="84"  font-size="74" font-style="italic" fill="#C9A84C">thoughtfully taught.</tspan>
    </text>
  </g>

  <!-- Secondary line / subtitle -->
  <text x="80" y="518"
        font-family="'DM Sans', system-ui, sans-serif"
        font-size="22" font-weight="400" fill="#F8F4EA" opacity="0.85">
    1&#8209;on&#8209;1 tutoring with Mr PS Ndlovu &#8226; University &amp; postgraduate &#8226; Stats &#183; Data Analytics &#183; ML
  </text>

  <!-- ============================================================
       Bottom strip — URL + CTA pill
       ============================================================ -->
  <!-- URL -->
  <text x="80" y="578"
        font-family="'DM Sans', system-ui, sans-serif"
        font-size="20" font-weight="500" letter-spacing="2.5"
        fill="#C9A84C">MDUBUSIMATHS.COM</text>

  <!-- CTA pill -->
  <g transform="translate(920,548)">
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#C9A84C"/>
    <text x="100" y="29"
          font-family="'DM Sans', system-ui, sans-serif"
          font-size="15" font-weight="700" letter-spacing="1.5"
          fill="#1B3A6B" text-anchor="middle">BOOK A SESSION</text>
  </g>
</svg>
